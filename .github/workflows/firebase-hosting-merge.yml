name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
      - master

permissions:
  checks: write
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Prepare Firebase config
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
            if (cfg.hosting && !Array.isArray(cfg.hosting) && !cfg.hosting.site && !cfg.hosting.target) {
              cfg.hosting.site = "gen-lang-client-0447110538";
              fs.writeFileSync("firebase.json", JSON.stringify(cfg, null, 2) + "\n");
            }
            if (!fs.existsSync(".firebaserc")) {
              fs.writeFileSync(".firebaserc", JSON.stringify({ projects: { default: "gen-lang-client-0447110538" } }, null, 2) + "\n");
            }
          '

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0447110538 }}
          projectId: gen-lang-client-0447110538
          channelId: live
          firebaseToolsVersion: '12.9.1'
